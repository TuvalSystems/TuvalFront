name: Validar pull request

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    name: Lint y compilacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener cambios del pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Usar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Revisar codigo
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Verificar archivos compilados
        run: test -s vue/index.html && test -s vue/version.json
